# 宏利投資計劃（productId=16）常見底層基金清單
#
# 注意：呢度嘅 ISIN 係佔位符（placeholder），用嚟畀系統先跑起。
# 行 `uv run manulife discover --product-id 16` 可以由宏利官方 API
# 自動下載最新真實清單覆蓋呢個檔案。
#
# 欄位：
#   code        系統內部代號
#   isin        基金 ISIN（用嚟對應宏利 API 同 PIB）
#   name        英文全名
#   name_zh     中文名（顯示喺報告）
#   category    equity / bond / balanced / money_market / multi_asset
#   region      us / asia / greater_china / japan / europe / global / emerging
#   currency    USD / HKD / EUR / JPY
#   benchmark   Yahoo Finance ticker，作歷史回報基準（如未抓到宏利歷史 NAV 用呢個替代）
#   theme       板塊主題（可選）：semiconductor / tech / ai / healthcare / energy / esg
#   risk_level  宏利風險評級 1-5（5 最高）

