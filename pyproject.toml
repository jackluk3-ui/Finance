[project]
name = "manulife-analyzer"
version = "0.1.0"
description = "Automated investment analysis pipeline for Manulife ILAS / savings plans"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
]
pdf = [
    "weasyprint>=62",
]

[project.scripts]
manulife = "manulife_analyzer.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manulife_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
